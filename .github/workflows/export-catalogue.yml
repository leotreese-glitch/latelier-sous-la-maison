# Outil ponctuel : exporte le catalogue publié (données publiques de /api/catalogue) dans cette branche,
# pour préparer les traductions. Branche à supprimer ensuite.
name: Export du catalogue
on:
  push:
    branches: [outil/export-catalogue]
    paths: [.github/workflows/export-catalogue.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le catalogue
        run: curl -fsS -A "export-catalogue" https://latelier-sous-la-maison.com/api/catalogue -o catalogue-export.json
      - name: Enregistrer dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue-export.json
          git commit -m "Export du catalogue publié [CF-Pages-Skip]"
          git push
