name: Photos des pièces retenues
on:
  push:
    branches: [outil/apercus-musees]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          MODE="$(cat outil/mode.txt)"
          if [ "$MODE" = "recherche" ] || [ "$MODE" = "planches" ]; then
            set +e
            pip install -q pillow==10.4.0 numpy==2.1.2
            timeout 1800 python -u outil/$MODE.py > outil/journal-$MODE.txt 2>&1
            echo "code de sortie : $?" >> outil/journal-$MODE.txt
            tail -n 30 outil/journal-$MODE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outil/journal-$MODE.txt
            for d in outil/recherche outil/planches outil/apercus; do if [ -e "$d" ]; then git add "$d"; fi; done
            git commit -q -m "Résultat de l'outil : $MODE [CF-Pages-Skip]"
            git push
            exit 0
          fi
          if [ "$(cat outil/mode.txt)" = "catalogue" ]; then
            curl -sS --fail https://latelier-sous-la-maison.pages.dev/api/catalogue -o outil/catalogue.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outil/catalogue.json
            git commit -m "Copie du catalogue publié [CF-Pages-Skip]"
            git push
            exit 0
          fi
          if [ "$(cat outil/mode.txt)" = "supprimer" ]; then
            gh release delete photos-motifs-retrouves --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
            exit 0
          fi
          pip install pillow==10.4.0 numpy==2.1.2
          python outil/photos_hd.py
          ls -la zips
          gh release delete photos-motifs-retrouves --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create photos-motifs-retrouves zips/* -R "$GITHUB_REPOSITORY" --target outil/apercus-musees --prerelease \
            --title "Photos des motifs retrouvés (temporaire)" --notes "Fichiers de travail temporaires, supprimés après transfert."
