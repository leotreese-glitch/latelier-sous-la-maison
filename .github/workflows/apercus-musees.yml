name: Photos des pièces retenues
on:
  push:
    branches: [outil/apercus-musees]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          MODE="$(cat outil/mode.txt)"
          if [ "$MODE" = "recherche" ] || [ "$MODE" = "planches" ] || [ "$MODE" = "notices" ] || [ "$MODE" = "pages" ] || [ "$MODE" = "verif_images" ] || [ "$MODE" = "sources" ]; then
            set +e
            python -m pip install -q pillow numpy
            timeout 1800 python -u outil/$MODE.py > outil/journal-$MODE.txt 2>&1
            echo "code de sortie : $?" >> outil/journal-$MODE.txt
            tail -n 30 outil/journal-$MODE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outil/journal-$MODE.txt
            for d in outil/recherche outil/planches outil/apercus outil/verif; do if [ -e "$d" ]; then git add "$d"; fi; done
            git commit -q -m "Résultat de l'outil : $MODE [CF-Pages-Skip]"
            git push
            exit 0
          fi
          if [ "$(cat outil/mode.txt)" = "catalogue" ]; then
            curl -sS --fail https://latelier-sous-la-maison.pages.dev/api/catalogue -o outil/catalogue.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outil/catalogue.json
            git commit -m "Copie du catalogue publié [CF-Pages-Skip]"
            git push
            exit 0
          fi
          if [ "$(cat outil/mode.txt)" = "supprimer" ]; then
            gh release delete photos-motifs-retrouves --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
            exit 0
          fi
          python -m pip install pillow numpy
          python outil/photos_hd.py
          ls -la zips
          if [ -f outil/ajouter.txt ] && gh release view photos-motifs-retrouves -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mv zips/bilan.json zips/bilan-reserve.json
            gh release upload photos-motifs-retrouves zips/* --clobber -R "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release delete photos-motifs-retrouves --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create photos-motifs-retrouves zips/* -R "$GITHUB_REPOSITORY" --target outil/apercus-musees --prerelease \
            --title "Photos des motifs retrouvés, lot 3 (temporaire)" --notes "Fichiers de travail temporaires, supprimés après transfert."
