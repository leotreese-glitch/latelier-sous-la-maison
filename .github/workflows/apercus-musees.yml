name: Aperçus des pièces de musée
on:
  push:
    branches: [outil/apercus-musees]
permissions:
  contents: write
jobs:
  apercus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow==10.4.0
      - run: python outil/apercus.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outil/apercus
          git commit -m "Vignettes des pièces de musée [CF-Pages-Skip]"
          git push
